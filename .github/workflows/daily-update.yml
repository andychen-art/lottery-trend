name: daily-update

# 每天在 GitHub 云端更新站点数据（不依赖任何个人电脑）
# 流程：本地起数据服务(8701) -> 抓 4 个玩法 -> 写 data/*.json -> 重建尾数指标页 -> 合规收尾 -> 自动提交

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00；再加一次 UTC 13:00 = 北京 21:00 兜底
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 启动数据服务（本机 8701）
        run: |
          set -x
          node _build/ssq_update_server.js > /tmp/srv.log 2>&1 &
          echo "server pid=$!"
          for i in $(seq 1 40); do
            if curl -sf --max-time 10 "http://127.0.0.1:8701/data?game=ssq&issueCount=3" > /tmp/probe.json; then
              echo "8701 就绪（第 ${i} 次探测）"
              break
            fi
            sleep 3
          done
          echo "--- 探测响应 ---"
          head -c 300 /tmp/probe.json || true
          echo
          echo "--- 服务日志 ---"
          tail -20 /tmp/srv.log || true

      - name: 抓数据并重建尾数页
        env:
          LOTTERY_BASE: ${{ github.workspace }}
          LOTTERY_SITE: ${{ github.workspace }}
          LOTTERY_SSQ_ROWS: ${{ github.workspace }}/_build/ssq_rows.json
          LOTTERY_SKIP_HENFULL: '1'
        run: |
          python _build/refresh_site.py

      - name: 合规提示 / canonical / sitemap 收尾
        run: |
          node _build/finalize.js "$GITHUB_WORKSPACE"

      - name: 核对产物
        run: |
          echo "--- data 目录 ---"
          ls -la data/ || true
          echo "--- 最新期号 ---"
          python - <<'PY'
          import json
          for g in ['ssq','qlc','dlt','hen22x5']:
              try:
                  d = json.load(open('data/%s.json' % g, encoding='utf-8'))
                  r = d.get('result', [])
                  print('  %-8s %5d 期  最新 %s' % (g, len(r), r[-1]['code'] if r else '-'))
                  assert len(r) > 100, '期数异常'
              except Exception as e:
                  print('  %-8s 读取失败: %s' % (g, e))
                  raise
          PY
          echo "--- 尾数页 ---"
          ls -la ssq-tail-metric.html

      - name: 提交并推送
        run: |
          rm -f _build/ssq_rows.json
          git config user.name  "lottery-bot"
          git config user.email "lottery-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次没有变化，跳过提交"
            exit 0
          fi
          git commit -m "auto: daily refresh $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push || (git pull --rebase --autostash && git push)
          echo "已推送: $(git log -1 --format='%h %s')"
